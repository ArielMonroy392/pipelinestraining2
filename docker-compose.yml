version: "3.8"

services:
  app:
    image: ghcr.io/arielmonroy392/restapp:${TAG}
    depends_on:
      - redisService
    ports:
      - "${PORT}:5000" 
    environment:
      - REDIS_PORT=${REDIS_PORT}
  
    restart: unless-stopped

  redisService:
    image: redis:alpine
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped\

networks:
  default:
    driver: bridge
