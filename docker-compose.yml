services:
  app:
    image: ghcr.io/arielmonroy392/restapp:${TAG}
    depends_on:
      - redisService
    ports:
      - "${PORT}:5000" 
    environment:
      - REDIS_PORT=${REDIS_PORT}
    restart: unless-stopped
    networks:
      - restapp-network

  redisService:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - restapp-network

networks:
  restapp-network:
    name: restapp-network-${ENV}
    driver: bridge
