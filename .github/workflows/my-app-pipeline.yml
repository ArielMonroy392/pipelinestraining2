name: CI

on:
  push:
    branches: ["arielMonroy_p2_base", "arielMonroy_p2_dev"]
  pull_request:
    branches: ["arielMonroy_p2_base", "arielMonroy_p2_dev"]
  workflow_dispatch:

env: 
  SEM_VERSION: "1.0.0"
  IMAGE_NAME: "arielmonroy392/restapp"
  GHCR_IMAGE: "ghcr.io/arielmonroy392/restapp"

jobs:
  ## 🔧 1. Static analysis + tests
  Static-codecheck:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup local venv
        run: python3 -m venv .venv

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Run unit tests
        run: .venv/bin/python -m pytest test/unit -v

      - name: Install coverage dependency
        run: .venv/bin/pip install coverage

      - name: Run coverage report
        run: .venv/bin/coverage run -m pytest test/unit && .venv/bin/coverage report


  ## 🔧 2. Build Docker image
  Build:
    runs-on: self-hosted
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get tag name
        id: vars
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          TAG="${BRANCH_NAME}-${SEM_VERSION}_${BUILD_NUMBER}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "$TAG" > image_tag.txt  # Save tag for deploy step

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$TAG .
          docker tag $IMAGE_NAME:$TAG $GHCR_IMAGE:$TAG

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push Docker image
        run: docker push $GHCR_IMAGE:$TAG

      - name: Upload TAG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt

  Deploy-dev:
    runs-on: self-hosted
    needs: Build
    environment:
      name: Develop
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag

      - name: Load tag into env
        run: |
          TAG=$(cat image_tag.txt)
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create .env file for docker-compose
        run: echo "IMAGE_TAG=$TAG" > .env

      - name: Export env vars to file
        run: echo "PORT=${{ vars.PORT }}" >> .env

      - name: Docker Compose Down 
        run: docker compose down

      - name: Docker Compose Up
        run: docker compose up -d

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run integration tests
        run: |
          .venv/bin/python -m pytest test/integration -v
      
      - name: Docker Compose Down
        run: docker compose down
  
  Deploy-prod:
    runs-on: self-hosted
    needs: Deploy-dev
    if: github.ref_name == 'arielMonroy_p2_base'
    environment:
      name: Production
      url: http://localhost:5001

    steps:
      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag

      - name: Load tag into env
        run: |
          TAG=$(cat image_tag.txt)
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create .env file for docker-compose
        run: echo "IMAGE_TAG=$TAG" > .env

      - name: Export env vars to file
        run: echo "PORT=${{ vars.PORT }}" >> .env

      - name: Docker Compose Up
        run: docker compose up -d


      

      