name: CI

on:
  push:
    branches: ["arielMonroy_p2_base", "arielMonroy_p2_dev" ]
  pull_request:
    branches: ["arielMonroy_p2_base", "arielMonroy_p2_dev" ]


  workflow_dispatch:

env: 
  SEM_VERSION: "1.0.0"
  IMAGE_NAME:  "temp"

jobs:
  ## 🔧 1. 
  Static-codecheck:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      

      - name: Setup local venv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest test/unit -v
          
      - name: Install coverage dependency
        run: |
          python3 -m pip install coverage

      - name: Run coverage report
        run: coverage run -m pytest test/unit

