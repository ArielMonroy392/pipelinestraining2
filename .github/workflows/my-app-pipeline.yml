name: CI

on:
  push:
    branches: ["arielMonroy_p2_base", "arielMonroy_p2_dev"]
  pull_request:
    branches: ["arielMonroy_p2_base", "arielMonroy_p2_dev"]
  workflow_dispatch:

env: 
  SEM_VERSION: "1.0.0"
  IMAGE_NAME: "arielmonroy392/restapp"
  GHCR_IMAGE: "ghcr.io/arielmonroy392/restapp"

jobs:
  ## 🔧 1. Static analysis + tests
  Static-codecheck:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest test/unit -v

      - name: Install coverage dependency
        run: pip install coverage

      - name: Run coverage report
        run: |
          coverage run -m pytest test/unit
          coverage report

  ## 🔧 2. Build Docker image
  Build:
    runs-on: self-hosted
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get tag name
        id: vars
        run: |
          $branch = $env:GITHUB_REF -replace '^refs/heads/', ''
          $branch = $branch.ToLower()
          $buildNumber = $env:GITHUB_RUN_NUMBER
          $tag = "$branch-$env:SEM_VERSION`_$buildNumber"
          echo "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Set-Content -Path image_tag.txt -Value $tag

      - name: Build Docker image
        run: |
          docker build -t "$env:IMAGE_NAME:$env:TAG" .
          docker tag "$env:IMAGE_NAME:$env:TAG" "$env:GHCR_IMAGE:$env:TAG"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push Docker image
        run: docker push "$env:GHCR_IMAGE:$env:TAG"

      - name: Upload TAG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt

  Deploy-dev:
    runs-on: self-hosted
    needs: Build
    environment:
      name: Develop
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag

      - name: Load tag into env
        run: |
          $tag = Get-Content image_tag.txt
          echo "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create .env file for docker-compose
        run: |
          $tag = Get-Content image_tag.txt
          Set-Content -Path .env -Value "IMAGE_TAG=$tag"

      - name: Export env vars to file
        run: |
          Add-Content -Path .env -Value "PORT=${{ vars.PORT }}"

      - name: Docker Compose Down 
        run: docker compose down

      - name: Docker Compose Up
        run: docker compose up -d

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Run integration tests
        run: |
          .\.venv\Scripts\python -m pytest test/integration -v

      - name: Docker Compose Down
        run: docker compose down

  Deploy-prod:
    runs-on: self-hosted
    needs: Deploy-dev
    if: github.ref_name == 'arielMonroy_p2_base'
    environment:
      name: Production
      url: http://localhost:5001

    steps:
      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag

      - name: Load tag into env
        run: |
          $tag = Get-Content image_tag.txt
          echo "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create .env file for docker-compose
        run: |
          $tag = Get-Content image_tag.txt
          Set-Content -Path .env -Value "IMAGE_TAG=$tag"

      - name: Export env vars to file
        run: |
          Add-Content -Path .env -Value "PORT=${{ vars.PORT }}"

      - name: Docker Compose Up
        run: docker compose up -d
