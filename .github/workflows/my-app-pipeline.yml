name: CI

on:
  push:
    branches: ["arielMonroy_p2_base", "arielMonroy_p2_dev" ]
  pull_request:
    branches: ["arielMonroy_p2_base", "arielMonroy_p2_dev" ]


  workflow_dispatch:

env: 
    SEM_VERSION: "1.0.0"
    IMAGE_NAME: "arielmonroy392/restapp"
    GHCR_IMAGE: "ghcr.io/arielmonroy392/restapp"
jobs:
  ## 🔧 1. 
  Static-codecheck:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup local venv
        run: python3 -m venv .venv

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Run unit tests
        run: .venv/bin/python -m pytest test/unit -v

      - name: Install coverage dependency
        run: .venv/bin/pip install coverage

      - name: Run coverage report
        run: .venv/bin/coverage run -m pytest test/unit && .venv/bin/coverage report


  # 🔧 2. 
  Build:
    runs-on: self-hosted
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get tag name
        id: vars
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          TAG="${BRANCH_NAME}-${SEM_VERSION}+${BUILD_NUMBER}"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$TAG .
          docker tag $IMAGE_NAME:$TAG $GHCR_IMAGE:$TAG      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      
      - name: Tag Docker image
        run: docker tag myapp:latest ghcr.io/arielmonroy392/restapp:1.0.0

      - name: Push Docker image
        run: docker push ghcr.io/arielmonroy392/restapp:1.0.0

